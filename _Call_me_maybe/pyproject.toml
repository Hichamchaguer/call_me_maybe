[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hichamchaguer", email = "chaguer4@gmail.com" }
]
requires-python = ">=3.10"  # 42 requires 3.10+, 3.14 is too new and may lack packages
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

# This fixes the command: uv run python -m src
[project.scripts]
call-me-maybe = "src.main:main" 

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# THIS is the magic part that allows you to use just "src" instead of "src/call_me_maybe"
[tool.uv.build-backend]
module-name = "src"
module-root = ""
